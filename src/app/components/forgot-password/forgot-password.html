<div class="forgot-page">
  <div id="starfield"></div>
  <div class="nebula-bg"></div>
  <div class="nebula-cloud nc-1"></div>
  <div class="nebula-cloud nc-2"></div>
  <div class="nebula-cloud nc-3"></div>

  <div class="forgot-card">
    <div class="card-header">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="brand-name">LA CASA DEL PERFUME</h1>
      <p class="brand-sub">RECUPERAR CONTRASEÑA</p>
    </div>

    @if (!enviado()) {
      <p class="instrucciones">
        Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <form (ngSubmit)="enviar()" class="forgot-form">
        <div class="form-group">
          <label>CORREO ELECTRÓNICO</label>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="usuario@ejemplo.com"
            autocomplete="email"
            [disabled]="cargando()">
        </div>

        <button type="submit" class="btn-submit" [disabled]="cargando()">
          {{ cargando() ? 'ENVIANDO...' : 'ENVIAR ENLACE' }}
        </button>
      </form>
    }

    @if (mensaje()) {
      <div class="mensaje" [class.error]="esError()">{{ mensaje() }}</div>
    }

    <div class="card-footer">
      <a routerLink="/login" class="link-volver">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>

<div class="login-page">
  <!-- Starfield global (mismo que catálogo, historial, contacto) -->
  <div id="starfield"></div>
  <div class="nebula-bg"></div>
  <div class="nebula-cloud nc-1"></div>
  <div class="nebula-cloud nc-2"></div>
  <div class="nebula-cloud nc-3"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </div>
      <h1 class="brand-name">TIENDA</h1>
      <p class="brand-sub">{{ modoRegistro ? 'CREAR CUENTA' : 'INICIAR SESIÓN' }}</p>
    </div>

    <form (ngSubmit)="submit()" class="login-form">
      @if (modoRegistro) {
        <div class="form-group">
          <label>NOMBRE</label>
          <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" autocomplete="given-name">
        </div>
        <div class="form-group">
          <label>APELLIDO</label>
          <input type="text" [(ngModel)]="apellido" name="apellido" placeholder="Tu apellido" autocomplete="family-name">
        </div>
      }

      <div class="form-group">
        <label>CORREO ELECTRÓNICO</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="usuario@ejemplo.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label>CONTRASEÑA</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      @if (modoRegistro) {
        <div class="form-group">
          <label>TELÉFONO <span class="optional">(opcional)</span></label>
          <input type="tel" [(ngModel)]="telefono" name="telefono" placeholder="555-1234" autocomplete="tel">
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="cargando">
        {{ cargando ? 'PROCESANDO...' : (modoRegistro ? 'REGISTRARSE' : 'ENTRAR') }}
      </button>
    </form>

    @if (mensaje) {
      <div class="mensaje" [class.error]="esError()">{{ mensaje }}</div>
    }

    <div class="login-toggle">
      {{ modoRegistro ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?' }}
      <button type="button" class="btn-link" (click)="alternarModo()">
        {{ modoRegistro ? 'Inicia sesión' : 'Regístrate aquí' }}
      </button>
    </div>
  </div>
</div>
